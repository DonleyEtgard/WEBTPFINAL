<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formulario de Contacto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <form id="formularioJugador">
    <label for="nombreJugador">Jugador:</label>
    <input type="text" id="nombre" placeholder="Tu nombre" required />
    
    <label for="Email">Email:</label>
    <input type="email" id="Email" placeholder="email@ejemplo.com" required />
    
    <label for="mensaje">Mensaje:</label>
    <textarea id="mensaje" placeholder="Escribe tu mensaje" required></textarea>
    
    <button type="submit" id="btnEnviarDatos">Enviar</button>
    <p id="respuestaServidor"></p>
  </form>

  <button onclick="window.location.href='index.html'">Volver al juego</button>

  <script src="script.js"></script>
</body>
</html>
